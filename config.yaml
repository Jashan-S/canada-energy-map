# Ontario energy siting screener — pipeline configuration
# All sources are public. Edit here, not in code.

region:
  name: Ontario
  # Download/scoring box (lon_min, lat_min, lon_max, lat_max). The land mask is the scored
  # jurisdiction(s) inside this box, so this covers all of Ontario.
  bbox: [-95.2, 41.6, -74.3, 56.9]
  h3_resolution: 8          # finest resolution used (building footprints are aggregated at this level)
  # Resolution zones: dense south at res 8 (~0.74 km², ~160k hexes), sparse north at res 7
  # (~5.2 km², ~185k hexes) so the whole province stays light enough for a browser.
  zones:
    - {name: south, lat_max: 46.0, res: 8}
    - {name: north, lat_min: 46.0, res: 7}
  # Neighbouring (US / Quebec) infrastructure downloaded for display only (never scored)
  border_bbox: [-84.0, 41.6, -74.0, 46.6]

# Jurisdictions whose land is scored (ISO 3166-2, as in Natural Earth). Infrastructure
# elsewhere in the download box (e.g. New York, Michigan, Quebec) is kept for display
# (toggle in the map) but never counts toward scores. To expand, add a code here AND
# provide that jurisdiction's land-constraint layers (the LIO layers are Ontario-only).
jurisdictions:
  score: [CA-ON]

projection: "EPSG:3161"     # NAD83 / Ontario MNR Lambert — metres, used for all distances

natural_earth:
  base_url: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
  provinces: ne_10m_admin_1_states_provinces
  lakes: [ne_10m_lakes, ne_10m_lakes_north_america]

osm:
  # Ontario comes from Geofabrik's daily extract (reliable, no query limits); Overpass is only
  # used for the small neighbouring-jurisdiction box (display only).
  pbf_url: https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf
  endpoints:
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
    - https://overpass.private.coffee/api/interpreter
  timeout_s: 300

# Ontario GeoHub / Land Information Ontario open MapServer services.
# Layers are resolved by NAME at run time, so a renumbered layer id won't break the build.
lio:
  base_url: https://ws.lioservices.lrc.gov.on.ca/arcgis2/rest/services/LIO_OPEN_DATA
  generalize_deg: 0.0004    # ~40 m geometry simplification on download
  chunk: 1000              # server max is 2000
  layers:
    provincial_park:     {service: LIO_Open03, name: "Provincial Park Regulated"}
    conservation_reserve: {service: LIO_Open03, name: "Conservation Reserve Regulated"}
    national_wildlife:   {service: LIO_Open03, name: "National Wildlife Area"}
    federal_protected:   {service: LIO_Open03, name: "Federal Protected Area"}
    first_nation_reserve: {service: LIO_Open03, name: "Indian Reserve"}
    municipality:        {service: LIO_Open03, name: "Municipal Bnd Lower And Single"}
    wetland:             {service: LIO_Open01, name: "Wetland With Significance",
                          where: "WETLAND_SIGNIFICANCE IS NOT NULL",   # evaluated wetlands only
                          fields: "WETLAND_SIGNIFICANCE,EVALUATED_WETLAND_NAME"}
    built_up:            {service: LIO_Open01, name: "Built Up Area"}
    greenbelt:           {service: LIO_Open06, name: "Greenbelt Outer Boundary"}
    specialty_crop:      {service: LIO_Open06, name: "Greenbelt Specialty Crop"}
    oak_ridges_moraine:  {service: LIO_Open06, name: "ORM Planning Area"}
    niagara_escarpment:  {service: LIO_Open06, name: "Niagara Escarpment Plan Boundary"}
    soil:                {service: LIO_Open05, name: "Soil Survey Complex", fields: "CLI1,CLI1_1,PERCENT1"}
    airport:             {service: LIO_Open05, name: "Airport Official"}

# Building footprints (Microsoft Canadian Building Footprints, ODbL) -> coverage % per hex
buildings:
  url: https://minedbuildings.z5.web.core.windows.net/legacy/canadian-buildings-v2/Ontario.zip

# Hydro One List of Station Capacity (distribution-level generation room). The pipeline tries to
# download the latest PDF; if that fails it uses the committed parsed copy below.
capacity:
  fallback_csv: data/manual/hydroone_station_capacity_2025-11.csv
  thresholds_mw: [2, 5, 10]   # precomputed "distance to a station with >= X MW free" layers
  near_km: 15                 # nearest listed station shown in the detail panel within this distance

# IESO day-ahead nodal prices -> 4-hour arbitrage spread per station (BESS value signal)
prices:
  days: 60                    # trailing window of PUB_DAHourlyEnergyLMP files

# Feature settings
features:
  hv_kv: 115                # "transmission" threshold (kV)
  dc_kv: 230                # bulk-supply threshold used by the data-centre profile
  load_radius_km: 5         # radius for industrial-land load proxy
  substation_hv_snap_m: 300 # substation counts as HV if a >=hv_kv line ends within this distance
  price_node_max_km: 60

# Optional hand-maintained inputs in data/manual/ (templates provided)
manual:
  price_nodes: data/manual/price_nodes.csv
  municipal_stance: data/manual/municipal_stance.csv
  bess_projects: data/manual/bess_projects.csv
  grid_needs: data/manual/grid_needs.geojson
