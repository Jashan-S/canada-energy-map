name: Build data and deploy map

on:
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Re-download all source data"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["pipeline/**", "web/**", "config.yaml", "data/manual/**", ".github/workflows/**"]
  schedule:
    - cron: "17 7 3 * *"        # monthly refresh, 3rd of the month 07:17 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # queue new builds; never kill a long data download mid-way

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Reuse this month's downloads so code/weight tweaks rebuild in minutes, not an hour.
      # Restore and save are separate so partial downloads are kept even when a later step fails.
      - uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ steps.month.outputs.month }}-${{ github.run_id }}
          restore-keys: raw-${{ steps.month.outputs.month }}-

      - name: Fetch public data and build hex features
        run: python -m pipeline.run ${{ (inputs.force && '--force') || '' }}

      - name: Save downloaded data (even if the build failed)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ steps.month.outputs.month }}-${{ github.run_id }}

      - name: Data summary
        run: cat web/data/meta.json && du -sh web/data/*

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
